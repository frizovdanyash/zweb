server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # одностраничное приложение: любой путь отдаём как index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # хешированные бандлы кешируются надолго
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|webp|avif|wasm|tgs|json|bin)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # service worker и манифест — всегда свежие
  location ~* (sw\.js|\.webmanifest$|browserconfig\.xml$) {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;
}
