name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Собрать APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace
          gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/zweb-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/zweb.apk
          ls -lh apk

      - uses: actions/upload-artifact@v4
        with:
          name: zweb-apk
          path: apk/*.apk
          if-no-files-found: error

      - name: Выложить в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: zWeb APK
          body: |
            Готовая Android-обёртка zWeb.

            `zweb.apk` — release-сборка, `zweb-debug.apk` — debug.
            По умолчанию приложение открывает https://frizovdanyash.github.io/zweb/ —
            адрес меняется в самом приложении при первой ошибке загрузки.
          files: apk/*.apk
          make_latest: true
