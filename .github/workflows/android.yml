name: zWeb Android APK

on:
  push:
    branches: [main]
    paths:
      - 'TMessagesProj/**'
      - 'TMessagesProj_App*/**'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zweb-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Free disk space
        run: |
          # Освобождаем место, не трогая Android SDK, который нужен следующему шагу
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/lib/mono 2>/dev/null || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/2[0-6]* 2>/dev/null || true
          df -h / | tail -1

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK 27 and SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.2.12479018" "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :TMessagesProj_AppStandalone:assembleRelease --no-daemon --stacktrace \
            2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            {
              echo "### Build failed (exit $code)"
              echo '```'
              grep -E "error:|e: |FAILURE|What went wrong|Caused by|Could not|Execution failed" /tmp/build.log | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            grep -E "error:|e: |Execution failed|Caused by" /tmp/build.log | head -10 | while IFS= read -r line; do
              echo "::error title=Gradle::${line:0:400}"
            done
            exit "$code"
          fi

      - name: Publish build log
        if: always()
        continue-on-error: true
        run: |
          {
            echo "=== df ==="; df -h / /tmp | tail -3
            echo "=== free ==="; free -g | head -2
            echo "=== ошибки ==="
            grep -nE "error:|error;|FAILURE|What went wrong|Caused by|No space left|Killed|OutOfMemory|AAPT|Execution failed" /tmp/build.log 2>/dev/null | tail -80
            echo "=== хвост лога ==="
            tail -120 /tmp/build.log 2>/dev/null
          } > build-log.txt

          git config user.name "zWeb CI"
          git config user.email "ci@zweb.local"
          git checkout -q -B build-logs
          git add -f build-log.txt
          git commit -q -m "build log" || true
          git push -q -f origin build-logs || true

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_AppStandalone/build/outputs/apk -name "*.apk" -exec cp {} out/zweb.apk \;
          ls -lh out/
          unzip -l out/zweb.apk | grep -cE "classes.dex" || true
          echo "### APK готов" >> "$GITHUB_STEP_SUMMARY"
          echo "Размер: $(du -h out/zweb.apk | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zweb-android-apk
          path: out/zweb.apk
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: zWeb Android
          body: Автоматическая сборка нативного Android-клиента zWeb.
          files: out/zweb.apk
          make_latest: true
