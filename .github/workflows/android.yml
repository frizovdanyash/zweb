name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      - name: Собрать APK
        working-directory: android
        run: |
          set +e
          gradle assembleDebug assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee /tmp/gradle.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "### Ошибка сборки" >> $GITHUB_STEP_SUMMARY
            tail -60 /tmp/gradle.log >> $GITHUB_STEP_SUMMARY
            grep -nE "error:|FAILURE|What went wrong|Caused by|Unsupported|Could not" /tmp/gradle.log | tail -25 | while IFS= read -r line; do
              echo "::error title=Gradle::$line"
            done
            exit "$status"
          fi

      - name: Переименовать
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/zweb-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk apk/zweb.apk
          ls -lh apk

      - uses: actions/upload-artifact@v4
        with:
          name: zweb-apk
          path: apk/*.apk
          if-no-files-found: error

      - name: Выложить в релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: zWeb APK
          body: |
            Готовая Android-обёртка zWeb.

            `zweb.apk` — release-сборка, `zweb-debug.apk` — debug.
            По умолчанию приложение открывает https://frizovdanyash.github.io/zweb/ —
            адрес меняется в самом приложении при ошибке загрузки.
          files: apk/*.apk
          make_latest: true
