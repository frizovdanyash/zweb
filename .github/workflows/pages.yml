name: zWeb на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Проверить, включены ли Pages
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Pages не включены"
              echo ""
              echo "Откройте **Settings → Pages → Source: GitHub Actions** и запустите workflow заново."
              echo "Это единственная настройка, которую нельзя сделать из кода: у токена workflow нет прав на неё."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Включить Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Загрузить готовую сборку
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Опубликовать
        id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
